<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="SuperAdminCSS/Audit.css">
</head>
<body>
    <div class="d-flex">
        <!-- Side Bar Section -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <a href="Authorization.html" class="logo-link">
                    <img src="/Photos/central.png" alt="Central Logo" class="sidebar-logo full-logo">
                    <img src="/Photos/Central Icon.png" alt="Central Icon" class="sidebar-logo icon-logo d-none">
                </a>
                <button class="close-btn" id="closeSidebar"><i class="bi bi-list"></i></button>
            </div>
            <nav class="nav flex-column mt-3 flex-grow-1">
                <a class="nav-link" href="Authorization.html"><i class="bi bi-shield-exclamation"></i> <span>Authorization</span></a>
                <a class="nav-link" href="RuleManagement.html"><i class="bi bi-journal-text"></i> <span>Rule Management</span></a>
                <a class="nav-link" href="Reports&Analytics.html"><i class="bi bi-bar-chart-line"></i> <span>Reports & Analytics</span></a>
                <a class="nav-link active" href="Audit.html"><i class="bi bi-clipboard-data"></i> <span>Audit Log</span></a>
                <a class="nav-link" href="StudentHanbook.html"><i class="bi bi-book-half"></i> <span>Student Handbook</span></a>
            </nav>
            <div class="logout-container">
                <a class="logout-link" href="#"><i class="bi bi-box-arrow-left"></i> <span>Log Out</span></a>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div class="dashboard-content w-100">
            <div class="d-flex align-items-center">
                <button class="toggle-btn" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <h3 class="mb-0">Audit Log</h3>
            </div>

            <div class="container mt-4">
                <div class="exportBtn d-flex justify-content-end">
                    <button id="printTable" class="btn btn-primary">
                        <i class="bi bi-printer"></i> Print Table
                    </button>
                </div>
                <div class="table-container mt-3">
                    <!-- Table -->
                    <div class="table-responsive">
                        <table id="auditTable" class="table table-striped table-bordered align-middle w-100">
                        <thead class="table-light">
                            <tr>
                            <th>DATE</th>
                            <th>TIME</th>
                            <th>USER</th>
                            <th>EVENT</th>
                            <th>CHANGED FIELD</th>
                            <th>OLD VALUE</th>
                            <th>NEW VALUE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                            <td data-label="DATE">08/22/2025</td>
                            <td data-label="TIME">3:22 PM</td>
                            <td data-label="USER">User@gmail.com</td>
                            <td data-label="EVENT">Edit</td>
                            <td data-label="CHANGED FIELD">Violation</td>
                            <td data-label="OLD VALUE">Improper Uniform</td>
                            <td data-label="NEW VALUE">Tardiness</td>
                            </tr>
                        </tbody>
                        </table>
                    </div>
                </div>
            </div>               
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="SuperAdminJS/Audit.js"></script>
</body>
</html>
