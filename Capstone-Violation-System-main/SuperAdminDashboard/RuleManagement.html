<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="SuperAdminCSS/RuleManagement.css">
</head>
<body>
    <div class="d-flex">
        <!-- Side Bar Section -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <a href="Authorization.html" class="logo-link">
                    <img src="/Photos/central.png" alt="Central Logo" class="sidebar-logo full-logo">
                    <img src="/Photos/Central Icon.png" alt="Central Icon" class="sidebar-logo icon-logo d-none">
                </a>
                <button class="close-btn" id="closeSidebar"><i class="bi bi-list"></i></button>
            </div>
            <nav class="nav flex-column mt-3 flex-grow-1">
                <a class="nav-link" href="Authorization.html"><i class="bi bi-shield-exclamation"></i> <span>Authorization</span></a>
                <a class="nav-link active" href="RuleManagement.html"><i class="bi bi-journal-text"></i> <span>Rule Management</span></a>
                <a class="nav-link" href="Reports&Analytics.html"><i class="bi bi-bar-chart-line"></i> <span>Reports & Analytics</span></a>
                <a class="nav-link" href="Audit.html"><i class="bi bi-clipboard-data"></i> <span>Audit Log</span></a>
                <a class="nav-link" href="StudentHanbook.html"><i class="bi bi-book-half"></i> <span>Student Handbook</span></a>
            </nav>
            <div class="logout-container">
                <a class="logout-link" href="#"><i class="bi bi-box-arrow-left"></i> <span>Log Out</span></a>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div class="dashboard-content w-100">
            <div class="d-flex align-items-center">
                <button class="toggle-btn" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <h3 class="mb-0">Rule Management</h3>
            </div>

            <div class="container py-4">
                <!-- Create Rule Button -->
                <div class="create-rule-container mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createRuleModal">
                        <i class="bi bi-plus-circle"></i> Create Rule
                    </button>
                </div>

                <!-- DataTable -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table id="ruleTable" class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>Rule ID</th>
                                    <th>Rule Name</th>
                                    <th>Description</th>
                                    <th>Violation</th>
                                    <th>Severity</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td data-label="Rule ID">ID 001</td>
                                    <td data-label="Rule Name">Cheating</td>
                                    <td data-label="Description">Honesty is the best policy</td>
                                    <td data-label="Violation">Cheating</td>
                                    <td data-label="Severity">Minor A</td>
                                    <td data-label="Action">
                                        <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i> Edit</button>
                                        <button class="btn btn-sm btn-archive"><i class="bi bi-archive"></i> Archive</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Create Rule Modal -->
            <div class="modal fade" id="createRuleModal" tabindex="-1" aria-labelledby="createRuleModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="createRuleModalLabel">Create Rule</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label for="ruleName" class="form-label">Rule Name</label>
                                    <input type="text" class="form-control" id="ruleName" placeholder="Enter name...">
                                </div>
                                <div class="mb-3">
                                    <label for="ruleDescription" class="form-label">Description</label>
                                    <textarea class="form-control" id="ruleDescription" rows="3" placeholder="Enter description..."></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="correspondingViolation" class="form-label">Corresponding Violation</label>
                                    <select class="form-select" id="correspondingViolation">
                                        <option selected disabled>Select Violation</option>
                                        <option>Cheating</option>
                                        <option>Gambling</option>
                                        <option>Bullying</option>
                                        <option>Improper Uniform</option>
                                        <option>Discourtesy or Disrespect</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="correspondingSeverity" class="form-label">Corresponding Severity</label>
                                    <select class="form-select" id="correspondingSeverity">
                                        <option selected disabled>Select Severity</option>
                                        <option>Minor A</option>
                                        <option>Minor B</option>
                                        <option>Major A</option>
                                        <option>Major B</option>
                                        <option>Critical</option>
                                    </select>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Create</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="SuperAdminJS/RuleManagement.js"></script>
</body>
</html>
