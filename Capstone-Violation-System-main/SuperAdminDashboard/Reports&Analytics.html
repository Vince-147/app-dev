<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/SuperAdminDashboard/SuperAdminCSS/Reports&Analytics.css">
    <title>Reports & Analytics</title>
</head>
<body>
    <div class="d-flex">
        <!-- Side Bar Section -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <a href="AdminDashboard.html" class="logo-link">
                    <img src="/Photos/central.png" alt="Central Logo" class="sidebar-logo full-logo">
                    <img src="/Photos/Central Icon.png" alt="Central Icon" class="sidebar-logo icon-logo d-none">
                </a>
                <button class="close-btn" id="closeSidebar"><i class="bi bi-list"></i></button>
            </div>
            <nav class="nav flex-column mt-3 flex-grow-1">
               <a class="nav-link" href="Authorization.html"><i class="bi bi-shield-exclamation"></i> <span>Authorization</span></a>
                <a class="nav-link" href="RuleManagement.html"><i class="bi bi-journal-text"></i> <span>Rule Management</span></a>
                <a class="nav-link active" href="Reports&Analytics.html"><i class="bi bi-bar-chart-line"></i> <span>Reports & Analytics</span></a>
                <a class="nav-link" href="Audit.html"><i class="bi bi-clipboard-data"></i> <span>Audit Log</span></a>
                <a class="nav-link" href="StudentHanbook.html"><i class="bi bi-book-half"></i> <span>Student Handbook</span></a>
            </nav>
            <div class="logout-container">
                <a class="logout-link" href="#"><i class="bi bi-box-arrow-left"></i> <span>Log Out</span></a>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div class="dashboard-content w-100">
            <div class="d-flex align-items-center">
                <button class="toggle-btn" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <h3 class="mb-0">Reports and Analytics</h3>
                <input type="text" class="form-control ms-auto w-25 w-md-50 w-sm-75" id="searchInput" placeholder="Search">
            </div>
            <div class="container mt-4 w-100">
                <div class="exportBtn d-flex justify-content-end">
                    <button id="printTable" class="btn btn-primary">
                        <i class="bi bi-printer"></i> Print Table
                    </button>
                </div>

                <div class="grid-wrapper mt-3">
                <!-- Severity A card -->
                <div class="severity-card">
                    <div class="severity-header">
                        <span class="severity-title" id="">Severity A</span>
                        <div class="bi bi-exclamation-diamond-fill" style="color: #FDC500;"></div>
                    </div>
                    <div class="severity-value">34</div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 30%; background-color: #FDC500;;" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <span class="background-letter" style="color: rgba(253, 198, 0, 0.082);">A</span>
                </div>

                <!-- Severity B card -->
                <div class="severity-card">
                    <div class="severity-header">
                        <span class="severity-title" id="">Severity B</span>
                        <div class="bi bi-exclamation-diamond-fill" style="color: #fd8c00;"></div>
                    </div>
                    <div class="severity-value">34</div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 30%; background-color: #fd8c00;;" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <span class="background-letter" style=" color: #fd8b0010;">B</span>
                </div>

                <!-- Severity C card -->
                <div class="severity-card">
                    <div class="severity-header">
                        <span class="severity-title" id="">Severity C</span>
                        <div class="bi bi-exclamation-diamond-fill" style="color: #dc0000;"></div>
                    </div>
                    <div class="severity-value">34</div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 30%; background-color: #dc0000;;" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <span class="background-letter" style="color: #dc000010;">C</span>
                </div>

                <!-- Severity D card -->
                <div class="severity-card">
                    <div class="severity-header">
                        <span class="severity-title" id="">Severity D</span>
                        <div class="bi bi-exclamation-diamond-fill" style="color: #780000;"></div>
                    </div>
                    <div class="severity-value">34</div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 30%; background-color: #780000;;" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <span class="background-letter" style="color: #78000010;">D</span>
                </div>
                
                </div>

            </div>
        </div>
    </div>

<script src="/SuperAdminDashboard/SuperAdminJS/Reports&Analytics.js"></script>
</body>
</html>
