<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Severity Cards</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f9fa, #eef2f7);
      padding: 2rem;
    }
    .grid-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }
    .severity-card {
      position: relative;
      background: #fff;
      width: 100%;
      height: 12rem;
      padding: 1rem;
      border-radius: 0.6rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .severity-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.15);
    }
    .background-letter {
      position: absolute;
      font-size: 8rem;
      font-weight: 700;
      opacity: 0.08;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }
    .background-letter.A { color: #FDC500; }
    .background-letter.B { color: #fd8c00; }
    .background-letter.C { color: #dc0000; }
    .background-letter.D { color: #780000; }

    .severity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1.3rem;
      color: #333;
    }
    .severity-value {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 1rem 0 0.5rem;
      color: #555;
    }
    .progress {
      height: 10px;
      border-radius: 5px;
      background-color: #e9ecef;
    }
    .progress-bar {
      height: 10px;
      border-radius: 5px;
      transition: width 0.6s ease;
    }
  </style>
</head>
<body>
  <div class="grid-wrapper">
    <div class="severity-card">
      <div class="severity-header">
        <span>Severity A</span>
        <i class="bi bi-exclamation-diamond-fill" style="color:#FDC500;"></i>
      </div>
      <div class="severity-value">34</div>
      <div class="progress">
        <div class="progress-bar" style="width:30%; background:#FDC500;"></div>
      </div>
      <span class="background-letter A">A</span>
    </div>

    <div class="severity-card">
      <div class="severity-header">
        <span>Severity B</span>
        <i class="bi bi-exclamation-diamond-fill" style="color:#fd8c00;"></i>
      </div>
      <div class="severity-value">34</div>
      <div class="progress">
        <div class="progress-bar" style="width:30%; background:#fd8c00;"></div>
      </div>
      <span class="background-letter B">B</span>
    </div>

    <div class="severity-card">
      <div class="severity-header">
        <span>Severity C</span>
        <i class="bi bi-exclamation-diamond-fill" style="color:#dc0000;"></i>
      </div>
      <div class="severity-value">34</div>
      <div class="progress">
        <div class="progress-bar" style="width:30%; background:#dc0000;"></div>
      </div>
      <span class="background-letter C">C</span>
    </div>

    <div class="severity-card">
      <div class="severity-header">
        <span>Severity D</span>
        <i class="bi bi-exclamation-diamond-fill" style="color:#780000;"></i>
      </div>
      <div class="severity-value">34</div>
      <div class="progress">
        <div class="progress-bar" style="width:30%; background:#780000;"></div>
      </div>
      <span class="background-letter D">D</span>
    </div>
  </div>
</body>
</html>
